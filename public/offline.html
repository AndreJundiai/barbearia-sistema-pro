<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0c">
  <title>Sem conexão</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b0b0c; color: #e5e5e5; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #fff; }
    p { color: #a3a3a3; margin: 0 0 28px; line-height: 1.5; }
    button { background: #D4AF37; color: #0b0b0c; border: 0; border-radius: 999px; padding: 14px 28px; font-weight: 600; font-size: 15px; }
  </style>
</head>
<body>
  <div>
    <img src="/icons/icon-192.png" alt="">
    <h1>Você está sem internet</h1>
    <p>Verifique sua conexão para ver os horários disponíveis.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
